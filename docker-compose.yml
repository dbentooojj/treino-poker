services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rangelab}
      POSTGRES_USER: ${POSTGRES_USER:-rangelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rangelab}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-rangelab}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  integration:
    profiles: [test]
    build:
      context: .
      target: tester
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rangelab}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-rangelab}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rangelab}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-rangelab}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-RangeLab <no-reply@example.com>}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [frontend, backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
